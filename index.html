<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>AeroNet — Global Airport Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--line:#26364d;--text:#edf4ff;--muted:#93a7c2;--blue:#52b7ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:330px 1fr}.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);z-index:500}
header{padding:18px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0}.sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:4px}
.searchbox{padding:14px 15px 8px}input{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:#0b1524;color:white;font:inherit;outline:none}input:focus{border-color:var(--blue)}
.stats{display:flex;gap:8px;padding:5px 15px 12px}.stat{flex:1;background:#172438;border:1px solid var(--line);padding:8px;border-radius:8px}.stat b{display:block;font-size:16px}.stat small{color:var(--muted);font-size:10px}
.section{padding:9px 16px;border-block:1px solid var(--line);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#a9bdd6;display:flex;justify-content:space-between}
#results{overflow:auto;min-height:0;flex:1}.item{padding:11px 16px;border-bottom:1px solid #223148;cursor:pointer}.item:hover,.item.active{background:#1a2b42}.top{display:flex;justify-content:space-between}.code{color:#75caff;font-weight:800;font-size:12px}.type{color:var(--muted);font-size:9px;text-transform:uppercase}.name{font-size:12px;margin-top:4px}.place{font-size:10px;color:var(--muted);margin-top:3px}.empty{padding:20px;color:var(--muted);font-size:12px;line-height:1.5}
footer{padding:10px 15px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.5}
.mapwrap{min-width:0;min-height:0;position:relative}#map{height:100%;width:100%;background:#e1e6e8}.status{position:absolute;z-index:450;bottom:13px;left:13px;background:#101b2bef;border:1px solid #34465f;border-radius:8px;padding:9px 12px;font-size:11px;color:#c3d2e5;pointer-events:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111c2d;color:var(--text)}.leaflet-popup-content-wrapper{border:1px solid #34465f;border-radius:10px}.leaflet-popup-content{margin:13px 15px;min-width:220px}.leaflet-popup-close-button{color:#a9bdd6!important}
.pcode{font-size:15px;font-weight:900;color:#70c7ff}.pname{font-size:12px;font-weight:700;margin-top:3px}.ploc{font-size:10px;color:var(--muted);margin-top:3px}.label{font-size:9px;color:#91a9c6;text-transform:uppercase;letter-spacing:1px;margin:10px 0 5px}.metar{font:11px/1.55 ui-monospace,monospace;overflow-wrap:anywhere;color:#dbe8f7}.state{font-size:11px;color:var(--muted);line-height:1.5}.error{color:#ff9ba2}.refresh{margin-top:9px;padding:6px 9px;background:#1a2d45;border:1px solid #3a5878;border-radius:6px;color:#bfe5ff;cursor:pointer}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:44% 56%}header{padding:9px 13px}h1{font-size:16px}.searchbox{padding:8px 12px 5px}input{padding:8px}.stats{padding:3px 12px 8px}.stat{padding:6px}.stat b{font-size:13px}#results{display:grid;grid-template-columns:1fr 1fr;align-content:start}.item{padding:8px 10px}footer{display:none}.mapwrap{grid-row:2}.side{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<header><h1>✈ AeroNet</h1><div class="sub">GLOBAL AIRPORT MAP · LIVE METAR</div></header>
<div class="searchbox"><input id="search" type="search" placeholder="Search ICAO, IATA, airport or city…" autocomplete="off"></div>
<div class="stats"><div class="stat"><b id="total">—</b><small>Airports loaded</small></div><div class="stat"><b id="visible">0</b><small>On map</small></div></div>
<div class="section"><span>Airports in view</span><span id="zoom">ZOOM —</span></div>
<div id="results"><div class="empty">Loading worldwide airport data…</div></div>
<footer>Tiles: CARTO Positron · Airport data: OurAirports · METAR: VATSIM<br>No simulated aircraft or ATC traffic.</footer>
</aside>
<main class="mapwrap"><div id="map"></div><div class="status" id="status">Loading map…</div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
const map=L.map("map",{center:[25,10],zoom:2,minZoom:2,maxZoom:19,preferCanvas:true,worldCopyJump:true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
const urls=["https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv","https://davidmegginson.github.io/ourairports-data/airports.csv"];
const cellSize=5,index=new Map(),all=[],markers=new Map(),layer=L.layerGroup().addTo(map),renderer=L.canvas({padding:.5}),cache=new Map();
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let last=[],selected="",timer=0;
function parseCSV(s){let rows=[],row=[],v="",q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===","){row.push(v);v=""}else if(c==="\n"){row.push(v);rows.push(row);row=[];v=""}else if(c!=="\r")v+=c}if(v||row.length){row.push(v);rows.push(row)}let h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||""])))}
function add(a){let k=Math.floor(a.lat/cellSize)+":"+Math.floor(a.lon/cellSize);if(!index.has(k))index.set(k,[]);index.get(k).push(a)}
async function load(){let err;for(const url of urls){try{let res=await fetch(url);if(!res.ok)throw Error("HTTP "+res.status);let rows=parseCSV(await res.text());for(const r of rows){let type=r.type,lat=Number(r.latitude_deg),lon=Number(r.longitude_deg),icao=(r.ident||"").toUpperCase();if(!["large_airport","medium_airport","small_airport","heliport","seaplane_base"].includes(type)||!icao||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;let a={id:icao+"|"+lat+"|"+lon,icao,name:r.name||"Unnamed airport",type,lat,lon,city:r.municipality||"",country:r.iso_country||"",iata:r.iata_code||""};all.push(a);add(a)}if(!all.length)throw Error("Airport list is empty");all.sort((a,b)=>a.name.localeCompare(b.name));$("total").textContent=all.length.toLocaleString();draw();return}catch(e){err=e}}$("results").innerHTML='<div class="empty">Could not load airport data. Check your connection and reload.<br>'+esc(err?.message||"")+'</div>';$("status").textContent="Airport data unavailable"}
function types(z){if(z<4)return new Set(["large_airport"]);if(z<6)return new Set(["large_airport","medium_airport"]);if(z<9)return new Set(["large_airport","medium_airport","small_airport"]);if(z<11)return new Set(["large_airport","medium_airport","small_airport","seaplane_base"]);return new Set(["large_airport","medium_airport","small_airport","seaplane_base","heliport"])}
function inBounds(b,allowed){let s=b.getSouth(),n=b.getNorth(),w=b.getWest(),e=b.getEast(),ranges=e-w>=360?[[-180,180]]:w< -180?[[w+360,180],[-180,e]]:e>180?[[w,180],[-180,e-360]]:[[w,e]],found=[],seen=new Set();for(let y=Math.floor(s/5);y<=Math.floor(n/5);y++)for(const [lo,hi] of ranges)for(let x=Math.max(-36,Math.floor(lo/5));x<=Math.min(35,Math.floor(hi/5));x++){for(const a of index.get(y+":"+x)||[]){if(seen.has(a.id)||!allowed.has(a.type)||a.lat<s||a.lat>n||!ranges.some(([l,h])=>a.lon>=l&&a.lon<=h))continue;seen.add(a.id);found.push(a)}}return found}
function style(t){return {renderer,radius:t==="large_airport"?5:t==="medium_airport"?4:3,fillColor:t==="large_airport"?"#087fd1":t==="medium_airport"?"#16a6a0":t==="small_airport"?"#657c98":"#a17bd4",color:"#fff",weight:1,fillOpacity:.94}}
function draw(){if(!all.length)return;let z=map.getZoom(),visible=inBounds(map.getBounds(),types(z)),ids=new Set(visible.map(a=>a.id));for(const [id,m] of markers)if(!ids.has(id)){layer.removeLayer(m);markers.delete(id)}for(const a of visible)if(!markers.has(a.id)){let m=L.circleMarker([a.lat,a.lon],style(a.type));m.bindTooltip(esc(a.icao)+" · "+esc(a.name));m.on("click",()=>open(a,m));m.addTo(layer);markers.set(a.id,m)}last=visible;$("visible").textContent=visible.length.toLocaleString();$("zoom").textContent="ZOOM "+z;renderList(visible);$("status").innerHTML="<b>"+visible.length.toLocaleString()+"</b> airports in view · "+all.length.toLocaleString()+" worldwide"}
function renderList(list){let q=$("search").value.trim().toLowerCase(),arr=q?all.filter(a=>(a.icao+" "+a.iata+" "+a.name+" "+a.city+" "+a.country).toLowerCase().includes(q)).slice(0,100):list.slice().sort((a,b)=>rank(a.type)-rank(b.type)||a.name.localeCompare(b.name)).slice(0,80);if(!arr.length){$("results").innerHTML='<div class="empty">No matching airports in this view.</div>';return}$("results").innerHTML=arr.map(a=>'<div class="item '+(a.id===selected?"active":"")+'" data-id="'+esc(a.id)+'"><div class="top"><span class="code">'+esc(a.icao)+'</span><span class="type">'+esc(a.type.replace("_"," "))+'</span></div><div class="name">'+esc(a.name)+'</div><div class="place">'+esc([a.city,a.country].filter(Boolean).join(", "))+'</div></div>').join("")}
function rank(t){return t==="large_airport"?0:t==="medium_airport"?1:t==="small_airport"?2:3}
$("results").addEventListener("click",e=>{let el=e.target.closest(".item");if(!el)return;let a=all.find(x=>x.id===el.dataset.id);if(!a)return;selected=a.id;map.setView([a.lat,a.lon],Math.max(8,map.getZoom()));setTimeout(()=>{let m=markers.get(a.id);if(m)open(a,m)},220)});
$("search").addEventListener("input",()=>renderList(last));
function getMetar(code){if(!/^[A-Z0-9]{4}$/.test(code))return Promise.reject(Error("No four-character ICAO identifier is available for this airport."));let old=cache.get(code);if(old&&Date.now()-old.time<300000)return Promise.resolve(old.text);return fetch("https://metar.vatsim.net/"+encodeURIComponent(code),{cache:"no-store"}).then(async r=>{if(!r.ok)throw Error("METAR service HTTP "+r.status);let t=(await r.text()).trim();if(!t||/^(no data|not found|error)/i.test(t))throw Error("No current METAR report for "+code);cache.set(code,{text:t,time:Date.now()});return t})}
function decode(raw){let out=[],w=raw.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/),t=raw.match(/\b(M?\d{2})\/(M?\d{2}|XX)\b/),q=raw.match(/\bQ(\d{4})\b/),alt=raw.match(/\bA(\d{4})\b/),c=raw.match(/\b(?:FEW|SCT|BKN|OVC|VV)\d{3}(?:CB|TCU)?\b/g);if(w)out.push("Wind "+w[1]+"° at "+w[2]+" kt"+(w[3]?" gust "+w[3]+" kt":""));if(t)out.push("Temperature "+t[1].replace("M","-")+"°C · dew point "+t[2].replace("M","-")+"°C");if(q)out.push("QNH "+q[1]+" hPa");else if(alt)out.push("Altimeter "+(Number(alt[1])/100).toFixed(2)+" inHg");if(c)out.push("Clouds "+c.join(", "));return out}
function open(a,m){selected=a.id;renderList(last);let p=L.popup({maxWidth:330,minWidth:245}).setLatLng([a.lat,a.lon]).setContent('<div class="pcode">'+esc(a.icao)+'</div><div class="pname">'+esc(a.name)+'</div><div class="ploc">'+esc([a.city,a.country].filter(Boolean).join(", "))+'</div><div class="label">Latest METAR · VATSIM</div><div class="state" data-state>Loading report…</div><div data-details></div><button class="refresh" data-refresh>Refresh METAR</button>');m.bindPopup(p).openPopup();p.once("add",()=>fillPopup(a,p));setTimeout(()=>{if(m.isPopupOpen())fillPopup(a,p)},100)}
function fillPopup(a,p){let root=p.getElement();if(!root||root.dataset.loaded==="yes")return;root.dataset.loaded="yes";let state=root.querySelector("[data-state]"),details=root.querySelector("[data-details]"),button=root.querySelector("[data-refresh]");button.addEventListener("click",()=>{cache.delete(a.icao);root.dataset.loaded="";fillPopup(a,p)});getMetar(a.icao).then(raw=>{if(!root.isConnected)return;state.textContent="Report received · "+new Date().toLocaleTimeString();let d=decode(raw);details.innerHTML=(d.length?'<div class="label">Decoded conditions</div><div class="state">'+d.map(esc).join("<br>")+'</div>':"")+'<div class="label">Raw report</div><div class="metar">'+esc(raw)+'</div>'}).catch(e=>{if(!root.isConnected)return;state.className="state error";state.textContent=e.message+" (The source may restrict browser CORS access.)"})}
map.on("moveend zoomend",()=>{clearTimeout(timer);timer=setTimeout(draw,100)});
load();
})();
</script>
</body>
</html>
